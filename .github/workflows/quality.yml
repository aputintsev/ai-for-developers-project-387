name: Quality

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
      - name: Install application dependencies
        run: npm --prefix call-calendar ci
      - name: Install Chromium for browser tests
        run: npm --prefix call-calendar run install:browser -- --with-deps
      - name: Check
        run: mise run check
      - name: Verify generated API artifacts
        run: |
          git diff --exit-code HEAD -- call-calendar/api/openapi.yaml call-calendar/src/api/generated
          test -z "$(git ls-files --others --exclude-standard -- call-calendar/api/openapi.yaml call-calendar/src/api/generated)"
