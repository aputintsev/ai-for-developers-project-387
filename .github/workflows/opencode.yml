name: OpenCode

on:
  # Required for issue commands. Only authorized commenters can start analysis.
  # Exception expires on 2026-12-21.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: >-
    opencode-${{ (github.event.comment.user.type == 'User' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode '))) &&
      format('thread-{0}', github.event.issue.number || github.event.pull_request.number) ||
      format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.event.comment.user.type == 'User' &&
      !startsWith(github.event.comment.body, '/oc apply patch ') &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      reply: ${{ steps.opencode.outputs.reply }}
      patch: ${{ steps.opencode.outputs.patch }}
    steps:
      - name: Verify commenter has write access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) exit 1 ;;
          esac
      - name: Read discussion
        id: discussion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THREAD_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          endpoint="repos/$GH_REPO"
          if jq -e '.pull_request or .issue.pull_request' "$GITHUB_EVENT_PATH" >/dev/null; then
            gh api "$endpoint/pulls/$THREAD_NUMBER" > "$RUNNER_TEMP/opencode-pr.json"
            if ! jq -e --arg repo "$GH_REPO" '.head.repo.full_name == $repo' "$RUNNER_TEMP/opencode-pr.json" >/dev/null; then
              exit 0
            fi
            jq '{title, body}' "$RUNNER_TEMP/opencode-pr.json" > "$RUNNER_TEMP/opencode-thread.json"
          else
            gh api "$endpoint/issues/$THREAD_NUMBER" --jq '{title, body}' > "$RUNNER_TEMP/opencode-thread.json"
          fi
          command=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          if [[ ${command,,} == '/oc draft patch '* ]]; then
            jq -e --arg repo "$GH_REPO" '
              .state == "open" and .draft and .head.repo.full_name == $repo and
              .head.ref == "test/opencode-patch" and .base.ref == "main"
            ' "$RUNNER_TEMP/opencode-pr.json" >/dev/null
            head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/opencode-pr.json")
            gh api "$endpoint/contents/docs/opencode-patch-test.md?ref=$head_sha" --jq '.content' |
              base64 --decode > "$RUNNER_TEMP/opencode-patch-original.txt"
          fi
          gh api --paginate --slurp "$endpoint/issues/$THREAD_NUMBER/comments?per_page=100" |
            jq 'add | map({id, author: .user.login, body})' > "$RUNNER_TEMP/opencode-comments.json"
          if test -f "$RUNNER_TEMP/opencode-pr.json"; then
            gh api --paginate --slurp "$endpoint/pulls/$THREAD_NUMBER/comments?per_page=100" |
              jq 'add | map({id, author: .user.login, body, path, line, diff_hunk})' > "$RUNNER_TEMP/opencode-review-comments.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/opencode-review-comments.json"
          fi
          printf 'allowed=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.discussion.outputs.allowed == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'issue_comment' && github.sha || github.event.repository.default_branch }}
      - name: Install OpenCode
        if: steps.discussion.outputs.allowed == 'true'
        run: |
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" \
            https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-linux-x64.tar.gz
          printf '%s  %s\n' '563b5d663637226b6e3bb4bb6803281bc39b0d2cd88db06d674b6420aab009b0' "$archive" |
            sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-bin"
      - name: Answer comment
        id: opencode
        if: steps.discussion.outputs.allowed == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          IMPLEMENT: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && github.event.comment.user.login == github.event.repository.owner.login && startsWith(github.event.comment.body, '/oc implement this issue') }}
        run: |
          test -n "$OPENCODE_API_KEY"
          cat > opencode.json <<'JSON'
          {
            "providers": {
              "opencode-console": {
                "package": "@opencode/ai/providers/openai-compatible",
                "settings": {
                  "baseURL": "https://opencode.ai/inference/openai/v1",
                  "apiKey": "{env:OPENCODE_API_KEY}"
                },
                "models": {
                  "deepseek-v4.1-flash": {
                    "compatibility": { "reasoningField": "reasoning_content" },
                    "limit": { "context": 1000000, "output": 8000 }
                  }
                }
              }
            },
            "permissions": [
              { "action": "*", "resource": "*", "effect": "deny" },
              { "action": "read", "resource": "*", "effect": "allow" },
              { "action": "glob", "resource": "*", "effect": "allow" },
              { "action": "grep", "resource": "*", "effect": "allow" },
              { "action": "skill", "resource": "to-spec", "effect": "allow" },
              { "action": "skill", "resource": "to-tickets", "effect": "allow" },
              { "action": "skill", "resource": "implement-spec", "effect": "allow" }
            ]
          }
          JSON
          jq -n \
            --slurpfile thread "$RUNNER_TEMP/opencode-thread.json" \
            --slurpfile comments "$RUNNER_TEMP/opencode-comments.json" \
            --slurpfile reviews "$RUNNER_TEMP/opencode-review-comments.json" \
            '$thread[0] + {comments: $comments[0], review_comments: $reviews[0]}' > "$RUNNER_TEMP/opencode-context.txt"
          request=$(jq -c '.comment | {body: (.body | sub("^/(oc|opencode) "; ""; "i")), path, line, diff_hunk}' "$GITHUB_EVENT_PATH")
          attachment="$RUNNER_TEMP/opencode-context.txt"
          prompt=$(printf '%s\n\nRequest: %s' \
            'Answer the repository maintainer in Markdown using the attached discussion as context. Follow the current request as instructions. Keep the answer under 8000 characters.' \
            "$request")
          if test -f "$RUNNER_TEMP/opencode-patch-original.txt"; then
            attachment="$RUNNER_TEMP/opencode-patch-original.txt"
            prompt=$(printf '%s\n\nRequest: %s' \
              'Propose a replacement for the attached one-line test file. Output one plain ASCII sentence of at most 200 characters. Give only the replacement text, without quotes, code fences, or commentary.' \
              "$request")
          fi
          reply="$RUNNER_TEMP/opencode-reply.md"
          agent=plan
          if [[ $IMPLEMENT == true ]]; then
            agent=build
            jq '.permissions += [
              {"action":"edit","resource":"*","effect":"allow"},
              {"action":"edit","resource":".git/**","effect":"deny"},
              {"action":"edit","resource":".github/workflows/**","effect":"deny"},
              {"action":"edit","resource":"opencode.json","effect":"deny"}
            ]' opencode.json > "$RUNNER_TEMP/opencode-config.json"
            mv "$RUNNER_TEMP/opencode-config.json" opencode.json
            prompt='Implement the attached GitHub issue in the working tree using your edit tool. Treat other comments as context. Summarize the actual edits. The workflow publishes a draft PR afterward.'
          fi
          "$RUNNER_TEMP/opencode-bin/opencode" --standalone run \
            --agent "$agent" --model opencode-console/deepseek-v4.1-flash \
            --file "$attachment" -- "$prompt" > "$reply"
          if ! test -s "$reply"; then
            printf '%s\n' 'OpenCode did not return an answer.' >&2
            exit 1
          fi
          if test -f "$RUNNER_TEMP/opencode-patch-original.txt"; then
            original=$(cat "$attachment")
            replacement=$(cat "$reply")
            test "$original" != "$replacement"
            pattern='^[a-zA-Z0-9][a-zA-Z0-9 .,!?:;-]{0,198}\.$'
            [[ $original =~ $pattern && $replacement =~ $pattern ]]
            head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/opencode-pr.json")
            encoded=$(printf '%s\n' "$replacement" | base64 -w 0)
            printf "OpenCode proposes this patch for \`docs/opencode-patch-test.md\`.\n\n\`\`\`diff\n-%s\n+%s\n\`\`\`\n\nApprove with \`/oc apply patch <this comment ID>\`.\n\n<!-- opencode-patch %s %s -->\n" \
              "$original" "$replacement" "$head_sha" "$encoded" > "$reply"
          else
            sed -i '/^<!-- opencode-patch /d' "$reply"
          fi
          printf 'reply=%s\n' "$(head -c 24000 "$reply" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          if [[ $IMPLEMENT == true ]]; then
            rm opencode.json
            git add --all
            git diff --cached --check
            git diff --cached --binary > "$RUNNER_TEMP/opencode.patch"
            test -s "$RUNNER_TEMP/opencode.patch"
            test "$(wc -c < "$RUNNER_TEMP/opencode.patch")" -le 90000
            printf 'patch=%s\n' "$(base64 -w 0 "$RUNNER_TEMP/opencode.patch")" >> "$GITHUB_OUTPUT"
          fi

  reply:
    needs: analyze
    if: needs.analyze.outputs.reply != '' && needs.analyze.outputs.patch == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post OpenCode response
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPLY: ${{ needs.analyze.outputs.reply }}
        run: |
          test -n "$REPLY"
          endpoint="repos/$GH_REPO/issues/$ISSUE_NUMBER/comments"
          if test "$GITHUB_EVENT_NAME" = pull_request_review_comment; then
            comment_id=$(jq -r '.comment.in_reply_to_id // .comment.id' "$GITHUB_EVENT_PATH")
            endpoint="repos/$GH_REPO/pulls/$ISSUE_NUMBER/comments/$comment_id/replies"
          fi
          printf '%s' "$REPLY" | base64 --decode | jq -Rs '{body: .}' |
            gh api "$endpoint" --input - --jq .html_url

  publish-implementation:
    needs: analyze
    if: needs.analyze.outputs.patch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Commit and open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PATCH: ${{ needs.analyze.outputs.patch }}
        run: |
          printf '%s' "$PATCH" | base64 --decode > "$RUNNER_TEMP/opencode.patch"
          git apply --index "$RUNNER_TEMP/opencode.patch"
          git diff --cached --check
          git diff --cached --quiet -- .github/workflows
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "feat: implement issue #$ISSUE_NUMBER with OpenCode (#$ISSUE_NUMBER)"
          branch="opencode/issue-$ISSUE_NUMBER-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          pr=$(gh pr create --repo "$GH_REPO" --base "$BASE_BRANCH" --head "$branch" --draft \
            --title "OpenCode implementation for issue #$ISSUE_NUMBER" --body "Closes #$ISSUE_NUMBER")
          run_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GH_REPO/commit/$(git rev-parse HEAD)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --body "$(printf 'OpenCode opened a draft PR.\n\n- PR %s\n- Commit %s\n- Actions %s\n' "$pr" "$commit_url" "$run_url")"

  apply-test-patch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      startsWith(github.event.comment.body, '/oc apply patch ')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Apply the approved change to the test branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          command=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          command_pattern='^/oc apply patch ([0-9]+)$'
          [[ $command =~ $command_pattern ]]
          proposal_id=${BASH_REMATCH[1]}
          branch=test/opencode-patch
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/opencode-apply-pr.json"
          head_sha=$(jq -er --arg repo "$GH_REPO" --arg branch "$branch" '
            select(.state == "open" and .draft and .head.repo.full_name == $repo and
              .head.ref == $branch and .base.ref == "main") | .head.sha
          ' "$RUNNER_TEMP/opencode-apply-pr.json")
          proposal=$(gh api "repos/$GH_REPO/issues/comments/$proposal_id" --jq '
            select(.user.login == "github-actions[bot]" and .user.type == "Bot") |
            [.issue_url, (.body | split("\n") | map(select(startswith("<!-- opencode-patch "))) | last)] | @tsv
          ')
          IFS=$'\t' read -r issue_url marker <<< "$proposal"
          test "$issue_url" = "$GITHUB_API_URL/repos/$GH_REPO/issues/$PR_NUMBER"
          marker_pattern='^<!-- opencode-patch ([a-f0-9]{40}) ([A-Za-z0-9+/=]{1,272}) -->$'
          [[ $marker =~ $marker_pattern ]]
          test "${BASH_REMATCH[1]}" = "$head_sha"
          encoded=${BASH_REMATCH[2]}
          replacement=$(printf '%s' "$encoded" | base64 --decode)
          pattern='^[a-zA-Z0-9][a-zA-Z0-9 .,!?:;-]{0,198}\.$'
          [[ $replacement =~ $pattern ]]
          encoded=$(printf '%s\n' "$replacement" | base64 -w 0)
          jq -n --arg repo "$GH_REPO" --arg branch "$branch" --arg head "$head_sha" --arg contents "$encoded" '
            {
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "test: apply approved OpenCode patch (#2)"},
                fileChanges: {additions: [{path: "docs/opencode-patch-test.md", contents: $contents}]}
              }}
            }' | gh api graphql --input - --jq .data.createCommitOnBranch.commit.url
