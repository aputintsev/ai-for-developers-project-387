name: PR 37 browser evidence

on:
  push:
    branches: [verification/pr-37-browser-bac196d]

permissions:
  contents: read

concurrency:
  group: pr-37-browser-evidence
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_SHA: bac196d657c0c7ebe8b15bc75c7cbaa0324ff6f0
      BEFORE_FIX_SHA: e1334580888ae60f32caa5525bd0cc5b6ce2ff03
      BASE_SHA: eaf7b120919d0dea8a5af3c7552094d81e2dbca5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          path: revisions/head
          persist-credentials: false
      - name: Checkout revision before the fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BEFORE_FIX_SHA }}
          path: revisions/before-fix
          persist-credentials: false
      - name: Checkout exact PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: revisions/base
          persist-credentials: false
      - name: Install application dependencies and Chromium
        run: |
          for revision in base before-fix head; do
            npm --prefix "revisions/$revision/call-calendar" ci
          done
          npm --prefix revisions/head/call-calendar run install:browser -- --with-deps
      - name: Run independent browser scenarios
        run: |
          evidence="$RUNNER_TEMP/browser-evidence"
          mkdir -p "$evidence"
          cp .github/scripts/pr37-browser-check.mjs "$evidence/"
          script="$evidence/pr37-browser-check.mjs"
          node "$script" "$PWD/revisions/base" base "$BASE_SHA" "$evidence"
          node "$script" "$PWD/revisions/before-fix" before-fix "$BEFORE_FIX_SHA" "$evidence"
          node "$script" "$PWD/revisions/head" head "$HEAD_SHA" "$evidence"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-37-browser-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: error
